<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodie Express</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <nav>
        <div class="logo">🍔 FoodieExpress</div>

        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#menu">Menu</a></li>
            <li><a href="#reviews">Reviews</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>

        <div class="cart-btn">
            <i class="fas fa-shopping-cart"></i>
            <span id="cart-count">0</span>
        </div>
    </nav>

    <section class="hero">
        <div class="hero-content">
            <h1>Delicious Food Delivered Fast</h1>
            <p>Order your favourite meals anytime, anywhere.</p>

            <input type="text"
                   id="search"
                   placeholder="Search food...">

            <button class="explore-btn">
                Explore Menu
            </button>
        </div>
    </section>

    <section class="categories">

        <button class="category active"
        data-category="all">All</button>

        <button class="category"
        data-category="pizza">Pizza</button>

        <button class="category"
        data-category="burger">Burger</button>

        <button class="category"
        data-category="drink">Drinks</button>

        <button class="category"
        data-category="dessert">Dessert</button>

    </section>

    <section id="menu" class="menu-container">

    </section>

    <div class="cart-sidebar">

        <h2>Your Cart</h2>

        <div id="cart-items">

        </div>

        <div class="cart-total">
            Total: ₹<span id="total">0</span>
        </div>

        <button class="checkout-btn">
            Checkout
        </button>

    </div>

    <section class="reviews" id="reviews">

        <h2>Customer Reviews</h2>

        <div class="review-box">
            ⭐⭐⭐⭐⭐ Amazing food and quick delivery.
        </div>

        <div class="review-box">
            ⭐⭐⭐⭐⭐ Best food ordering website.
        </div>

    </section>

    <footer id="contact">

        <h3>FoodieExpress</h3>

        <p>Email: support@foodie.com</p>

        <div class="socials">
            <i class="fab fa-facebook"></i>
            <i class="fab fa-instagram"></i>
            <i class="fab fa-twitter"></i>
        </div>

    </footer>

    <script src="script.js"></script>

</body>
</html>
